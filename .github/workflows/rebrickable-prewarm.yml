name: Rebrickable Prewarm

on:
  schedule:
    - cron: "0 3 */10 * *"
  workflow_dispatch:

jobs:
  prewarm:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.PREWARM_BASE_URL }}" ]; then echo "Missing PREWARM_BASE_URL"; exit 1; fi
          if [ -z "${{ secrets.REBRICKABLE_PREWARM_TOKEN }}" ]; then echo "Missing REBRICKABLE_PREWARM_TOKEN"; exit 1; fi

      - name: Prewarm all categories
        run: |
          set -euo pipefail
          BASE_URL="${{ secrets.PREWARM_BASE_URL }}"
          TOKEN="${{ secrets.REBRICKABLE_PREWARM_TOKEN }}"

          ids=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors "$BASE_URL/api/rebrickable/prewarm?list=1" -H "x-prewarm-token: $TOKEN" | jq -r '.results[].id')

          failures=0
          for id in $ids; do
            echo "Prewarming category $id"
            if ! curl -sS --fail --retry 4 --retry-delay 3 --retry-all-errors -X POST "$BASE_URL/api/rebrickable/prewarm?category_id=$id" -H "x-prewarm-token: $TOKEN" > /dev/null; then
              echo "Warning: category prewarm failed for $id"
              failures=$((failures + 1))
            fi
          done

          echo "Category prewarm done (failures: $failures)"

      - name: Prewarm collectible minifigure themes
        run: |
          set -euo pipefail
          BASE_URL="${{ secrets.PREWARM_BASE_URL }}"
          TOKEN="${{ secrets.REBRICKABLE_PREWARM_TOKEN }}"

          theme_ids=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors "$BASE_URL/api/rebrickable/prewarm?list=minifigures" -H "x-prewarm-token: $TOKEN" | jq -r '.results[].id')

          failures=0
          for theme_id in $theme_ids; do
            echo "Prewarming minifigure theme $theme_id"
            if ! curl -sS --fail --retry 4 --retry-delay 3 --retry-all-errors -X POST "$BASE_URL/api/rebrickable/prewarm?minifigure_theme_id=$theme_id" -H "x-prewarm-token: $TOKEN" > /dev/null; then
              echo "Warning: minifigure prewarm failed for theme $theme_id"
              failures=$((failures + 1))
            fi
            sleep 2
          done

          echo "Minifigure prewarm done (failures: $failures)"
