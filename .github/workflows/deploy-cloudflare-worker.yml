name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          REBRICKABLE_NEW_API_KEY: ${{ secrets.REBRICKABLE_NEW_API_KEY }}
        run: |
          [ -n "$CF_API_TOKEN" ] || (echo "Missing CF_API_TOKEN" && exit 1)
          [ -n "$CF_ACCOUNT_ID" ] || (echo "Missing CF_ACCOUNT_ID" && exit 1)
          [ -n "$REBRICKABLE_API_KEY" ] || [ -n "$REBRICKABLE_NEW_API_KEY" ] || (echo "Missing REBRICKABLE_API_KEY" && exit 1)

      - name: Sync runtime secrets to Worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          REBRICKABLE_NEW_API_KEY: ${{ secrets.REBRICKABLE_NEW_API_KEY }}
        run: |
          API_KEY="$REBRICKABLE_API_KEY"
          if [ -z "$API_KEY" ]; then API_KEY="$REBRICKABLE_NEW_API_KEY"; fi
          printf "%s" "$API_KEY" | npx wrangler secret put REBRICKABLE_API_KEY --config wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run deploy

      - name: Re-apply wrangler bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPEN_NEXT_DEPLOY: "true"
        run: npx wrangler deploy --config wrangler.toml

      - name: Verify production bindings
        run: |
          URL="https://lego-piezas-faltantes.martindasnoy.workers.dev/api/system/health"
          BODY=$(curl -fsS "$URL")
          echo "$BODY"
          printf "%s" "$BODY" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d); if(!j?.bindings?.catalog_cache){console.error('Missing CATALOG_CACHE binding in production'); process.exit(1);} console.log('CATALOG_CACHE binding verified');});"
